<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SlideRelay</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="window">
      <header class="top">
        <img src="../../assets/logo.svg" alt="" width="28" height="28" />
        <span class="brand">SlideRelay</span>
        <span id="live-pill" class="live-pill" hidden>Live</span>
      </header>

      <!-- macOS only, until done: PowerPoint for Mac needs a trusted local connection. -->
      <section id="setup-card" class="sr-card stack" hidden>
        <h2>One-time step for PowerPoint</h2>
        <p class="sr-muted">
          Let PowerPoint connect securely to SlideRelay on this Mac. macOS will ask for your Mac
          password once.
        </p>
        <button id="setup-btn" class="sr-btn sr-btn--primary">Let PowerPoint connect</button>
        <p id="setup-error" class="error" role="alert" hidden></p>
      </section>

      <section id="idle" class="stack">
        <h1>Ready</h1>
        <p class="sr-muted">
          In PowerPoint, open <strong>Home → Broadcast</strong> and click
          <strong>Start Broadcast</strong>.
        </p>
        <button id="start-btn" class="sr-btn sr-btn--primary sr-btn--big">Start Broadcast</button>
      </section>

      <section id="broadcasting" class="stack" hidden>
        <h1 id="status-line"></h1>
        <p class="sr-muted"><span id="viewer-count">0</span> students connected</p>
        <p id="link" class="link"></p>
        <button id="stop-btn" class="sr-btn sr-btn--big">Stop Broadcast</button>
      </section>

      <footer class="sr-muted small">Version <span id="version"></span></footer>
    </main>
  </body>
</html>
