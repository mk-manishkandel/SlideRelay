<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Pinch-to-zoom stays enabled on purpose. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>SlideRelay</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/viewer.ts"></script>
  </head>
  <body>
    <main id="stage">
      <img id="slide" alt="The presenter's current slide" hidden />
    </main>

    <!-- Status message (waiting, paused, reconnecting, ended…). -->
    <div id="message" class="message" role="status" aria-live="polite">
      <p id="message-title">Connecting…</p>
      <p id="message-detail" class="detail"></p>
    </div>

    <!-- Small tag saying what the presenter did: paused (over the frozen slide)
         or blanked (on a black screen), so viewers aren't left guessing. -->
    <div id="mode-tag" class="tag" hidden></div>

    <!-- PIN prompt (only if the presenter set a PIN). -->
    <form id="pin-form" class="pin" hidden novalidate>
      <div class="pin-card">
        <img class="pin-logo" src="/favicon.svg" alt="" width="44" height="44" />
        <h1 class="pin-title">Enter the PIN</h1>
        <p class="pin-sub">The presenter will tell you the 4–8 digit PIN for this broadcast.</p>
        <label class="visually-hidden" for="pin-input">PIN</label>
        <input
          id="pin-input"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]*"
          maxlength="8"
          placeholder="••••"
          aria-describedby="pin-error"
          required
        />
        <p id="pin-error" class="pin-error" role="alert" hidden>
          That PIN isn't right. Check it and try again.
        </p>
        <button id="pin-join" type="submit" disabled>Join</button>
      </div>
    </form>

    <!-- Appears on tap, then fades away. -->
    <button id="fullscreen-btn" class="fs" type="button" hidden aria-label="Full screen">
      Full screen
    </button>
  </body>
</html>
