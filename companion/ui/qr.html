<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scan to watch</title>
    <script type="module" src="./qr.ts"></script>
  </head>
  <!-- Full screen on the projector. Click anywhere to hide it. -->
  <body class="qr-body">
    <main class="qr-window">
      <div id="qr" class="qr-code" role="img" aria-label="QR code for the viewer link"></div>
      <p id="link" class="qr-link"></p>
      <p class="qr-hint">Scan with your phone camera, or type the link.</p>
      <p class="qr-close">Click anywhere to close</p>
    </main>
  </body>
</html>
