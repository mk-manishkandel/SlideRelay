<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect PowerPoint</title>
    <script type="module" src="./pair.ts"></script>
  </head>
  <body>
    <main class="window stack">
      <img src="../../assets/logo.svg" alt="" width="40" height="40" />
      <h1 id="title">Allow PowerPoint to use SlideRelay?</h1>
      <p id="body" class="sr-muted">
        Only click Allow if you just clicked <strong>Connect</strong> in PowerPoint.
      </p>
      <div id="actions" class="row">
        <button id="deny" class="sr-btn">Don't allow</button>
        <button id="allow" class="sr-btn sr-btn--primary">Allow</button>
      </div>
    </main>
  </body>
</html>
