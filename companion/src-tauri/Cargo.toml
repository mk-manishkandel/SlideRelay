[package]
name = "sliderelay"
version = "0.1.0"
description = "SlideRelay companion app: captures the PowerPoint slideshow window and streams it to viewers on the local network."
authors = ["Manish Kandel and SlideRelay contributors"]
license = "MIT"
repository = "https://github.com/mk-manishkandel/SlideRelay"
edition = "2021"
rust-version = "1.80"

[lib]
name = "sliderelay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Milestone 2: streaming to viewers
bytes = "1"
jpeg-encoder = "0.7"
fast_image_resize = "6"
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rust-embed = { version = "8", features = ["mime-guess"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"

# macOS only: PowerPoint for Mac's add-in panel refuses plain http://127.0.0.1,
# so on Mac the control API is also served over HTTPS with a local
# certificate that the presenter trusts once (see src/local_tls.rs).
[target.'cfg(target_os = "macos")'.dependencies]
rcgen = "0.14"
time = "0.3"
screencapturekit = "11"
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
winreg = "0.55"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
futures-util = "0.3"

[profile.release]
# Small, fast binaries.
codegen-units = 1
lto = true
opt-level = 3
strip = true
