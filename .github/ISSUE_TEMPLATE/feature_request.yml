name: Idea or request
description: Suggest something that would make SlideRelay better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what's hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea (optional)
